name: Check Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      DATABASE_PROVIDER: postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps || npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check linting
        continue-on-error: true
        run: npm run lint:check
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Check build
        run: npm run build
